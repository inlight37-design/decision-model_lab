<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger 모의 모드</title>
<style>
  :root {
    --surface-000:#f4f5f3; --surface-100:#fbfbfa; --surface-200:#e9eae6; --rule-100:#dcdeda; --rule-200:#b9bdb7;
    --ink-000:#16181a; --ink-100:#4c5157; --ink-200:#6b7178; --accent:#33518c; --accent-soft:#e4e9f2;
    --supported:#1c6b4b; --qualified:#8a6116; --rejected:#59616e; --unresolved:#c22e4e; --unknown:#7b8188;
    --sealed:#5e4b9a; --danger:#a32c1e;
    --sans:"IBM Plex Sans","Malgun Gothic",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-000:#141618; --surface-100:#1b1e21; --surface-200:#232629; --rule-100:#2c3034; --rule-200:#3c4147;
      --ink-000:#e7e8e6; --ink-100:#a9aeb2; --ink-200:#848a90; --accent:#8ea6d8; --accent-soft:#1e2836;
      --supported:#5cbf95; --qualified:#d6a65a; --rejected:#98a0aa; --unresolved:#f07b95; --unknown:#8e949a;
      --sealed:#a996e0; --danger:#e8917f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-000); color: var(--ink-000); font: 400 13.5px/21px var(--sans); }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 16px;
           border-bottom: 1px solid var(--rule-200); background: var(--surface-100); }
  header h1 { font-size: 15px; line-height: 24px; margin: 0; font-weight: 600; }
  .label { font: 600 11px/16px var(--mono); letter-spacing: .09em; text-transform: uppercase; padding-bottom: 2px;
           border-bottom: 2px solid currentColor; white-space: nowrap; }
  .mock { color: var(--ink-100); border: 1px dashed var(--ink-200); border-bottom-width: 1px; padding: 1px 6px; border-radius: 2px; }
  .meta { font: 400 12px/19px var(--mono); color: var(--ink-100); }
  .spacer { flex: 1; }
  main { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 24px; padding: 16px; max-width: 1280px; margin: 0 auto; }
  main > section { min-width: 0; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--surface-100); border: 1px solid var(--rule-200); border-radius: 3px; overflow: hidden; }
  .panel + .panel { margin-top: 16px; }
  .ph { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px;
        border-bottom: 1px solid var(--rule-200); background: var(--surface-200); }
  .ph .t { font-weight: 600; }
  .pb { padding: 12px 16px; }
  label.row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  #choices label.row { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; }
  #choices .meta { white-space: nowrap; }
  #choices select { grid-column: 2 / -1; min-width: 0; width: 100%; }
  label.row.policy { display: grid; gap: 4px; }
  #policy { min-width: 0; width: 100%; }
  textarea, select, input[type=number] { font: inherit; color: var(--ink-000); background: var(--surface-000);
       border: 1px solid var(--rule-200); border-radius: 2px; padding: 6px 8px; }
  textarea { width: 100%; resize: vertical; }
  select { padding: 2px 4px; font-size: 12px; }
  button { font: 500 12.5px/18px var(--sans); color: var(--accent); background: transparent; border: 1px solid var(--accent);
           border-radius: 2px; padding: 5px 10px; cursor: pointer; }
  button:hover { background: var(--accent-soft); }
  button:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.quiet { color: var(--ink-100); border-color: var(--rule-200); }
  .caption { font-size: 12px; line-height: 18px; color: var(--ink-100); }
  .runs button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--rule-100);
                 border-radius: 0; color: var(--ink-000); padding: 8px 16px; }
  .runs button[aria-current=true] { background: var(--accent-soft); }
  .runs .q { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  h2 { font-size: 19px; line-height: 30px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 4px; }
  .p { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--rule-100); }
  .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .who .v { font: 400 12px/18px var(--mono); color: var(--ink-200); }  /* ink-200은 12px 이상에서만(토큰 규칙) */
  .flags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .flag { font: 400 11px/16px var(--mono); color: var(--qualified); border: 1px solid currentColor; border-radius: 2px; padding: 0 6px; }
  .st-sealed, .st-accepted { color: var(--sealed); } .st-rejected { color: var(--danger); }
  .st-queued, .st-running, .st-awaiting_user { color: var(--ink-100); }
  /* unknown 색은 일반 글자 대비가 모자란다(K24). 글자는 잉크로, 관측하지 못했다는 표시는 unknown 색 1px 파선으로 */
  .st-unknown { color: var(--ink-100); border-bottom: 1px dashed var(--unknown); }
  .revealed .st-accepted { color: var(--ink-000); }
  .foot { padding: 12px 16px; border-top: 2px solid var(--unresolved); }
  .foot .warn { color: var(--unresolved); font-weight: 600; font-size: 13px; }
  .budget { display: flex; gap: 3px; margin: 8px 0 4px; }
  .cell { width: 22px; height: 10px; border: 1px solid var(--rule-200); border-radius: 1px; }
  .cell.ok { background: var(--rejected); border-color: var(--rejected); }
  .cell.bad { background: var(--rejected); border-color: var(--danger); }
  .cell.unk { border: 1px dashed var(--unknown); }
  .cell.run { border-color: var(--ink-100); }
  .metric { font: 500 21px/30px var(--mono); font-variant-numeric: tabular-nums; }
  .manual { margin-top: 8px; display: grid; gap: 6px; }
  .draft { white-space: pre-wrap; font-size: 13.5px; line-height: 21px; background: var(--surface-000);
           border: 1px solid var(--rule-100); border-radius: 2px; padding: 8px 10px; margin-top: 6px; overflow-wrap: anywhere; }
  h2 { overflow-wrap: anywhere; }
  details summary { cursor: pointer; color: var(--accent); font-size: 12.5px; }
  .kv { font: 400 12px/19px var(--mono); color: var(--ink-100); margin-top: 4px; overflow-wrap: anywhere; }
  .err { color: var(--danger); font-size: 12.5px; }
  .trail { font: 400 12px/18px var(--mono); color: var(--ink-200); overflow-wrap: anywhere; }
  .comparison { width: 100%; border-collapse: collapse; font-size: 13px; }
  .comparison th, .comparison td { text-align: left; vertical-align: top; padding: 10px;
    border-bottom: 1px solid var(--rule-100); overflow-wrap: anywhere; }
  .comparison th { color: var(--ink-100); font-weight: 600; }
  .compare-scroll { overflow-x: auto; }
  .comparison th:first-child { min-width: 160px; }
  .decision h3 { margin: 6px 0 10px; font-size: 18px; }
  .decision ul { padding-left: 20px; }
  .decision li { margin: 5px 0; }
  .layout-controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .layout-controls [aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Ledger</h1><span class="label mock" id="mode">모드 확인 중</span>
  <span class="spacer"></span>
  <span id="resume"></span>
  <span class="meta" id="status">연결 중…</span>
</header>
<main>
  <section>
    <div class="panel">
      <div class="ph"><span class="t">새 실행</span></div>
      <div class="pb">
        <textarea id="question" rows="4" aria-label="질문">사내 문서 검색을 지금 벡터 DB로 바꿀까, 기존 키워드 검색을 개선할까?</textarea>
        <div id="choices" style="margin-top:8px"></div>
        <label class="row">최소 정족수 인원 <input id="min" type="number" min="1" value="2" style="width:56px"></label>
        <label class="row policy">정족수에 셀 참여자
          <select id="policy" aria-label="정족수 정책">
            <option value="independent_only">독립성이 확인된 참여자만</option>
            <option value="include_unverified">미확인 CLI·원본 앱 답도 포함</option>
          </select></label>
        <div style="display:flex; gap:8px; align-items:center; margin-top:6px">
          <button id="start">시작</button><span class="err" id="formerr"></span>
        </div>
        <p class="caption" id="mode-note">실행 모드를 확인하고 있습니다.</p>
      </div>
    </div>
    <div class="panel">
      <div class="ph"><span class="t">실행</span></div>
      <div class="runs" id="runs"></div>
    </div>
  </section>
  <section id="detail"><p class="caption">왼쪽에서 실행을 시작하거나 고른다.</p></section>
</main>
<script>
"use strict";
const TOKEN = (() => {
  const m = location.hash.match(/token=([A-Za-z0-9_-]+)/);
  try {
    if (m) { sessionStorage.setItem("ledger-token", m[1]); history.replaceState(null, "", "/"); return m[1]; }
    return sessionStorage.getItem("ledger-token");
  } catch (e) { return m ? m[1] : null; }
})();
window.addEventListener("hashchange", () => location.reload());   // 열린 탭에 토큰 주소를 붙여 넣어도 동작한다
let selected = null, state = null;
let firstView = "decision"; // Q4 comparison only; no project preference is saved.
const drafts = {};   // 수동 답 입력칸의 임시 내용(참여자별). 다시 그려도 지우지 않는다
const confirms = {}; // 수동 답의 "원본 앱에 이 질문을 넣었다" 확인(참여자별). 다시 그려도 지우지 않는다

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false)
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}
async function api(path, body) {
  const res = await fetch(path, { method: body ? "POST" : "GET",
    headers: { "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}
const STATE_LABEL = { queued: "대기", running: "실행 중", awaiting_user: "사용자 전달 대기", accepted: "제출됨",
                      rejected: "받지 않음", unknown: "UNKNOWN · 종료 미확인" };
const PHASE_LABEL = { drafting: "독립 초안 · 봉인", revealed: "공개됨", preflight: "준비" };
const BEHAVIOR_LABEL = { ok: "정상", slow: "느림", fail: "CLI 오류", partial_input: "입력 일부만 읽음(큰 질문에서만 드러남)", hang: "멈춤(시간 초과)" };
const EXECUTION_LABEL = { mock: "CLI 모의", real: "실제 CLI", synthetic: "CLI 합성 시험" };

async function loadOptions() {
  const opt = await api("/api/options");
  document.title = opt.live ? "Ledger 실제 CLI" : "Ledger 모의 모드";
  document.getElementById("mode").textContent = opt.live
    ? "실제 CLI · 구독 사용량 소비" + (opt.context_unverified ? " · 문맥 미확인" : "")
    : "모의 모드 · 모델 호출 없음";
  document.getElementById("mode-note").textContent = (opt.live
    ? "시작하면 명시한 실제 CLI를 호출합니다. 서버 재시작은 호출 예산을 보충하지 않습니다. "
    : "CLI 참여자는 모의 CLI로 돕니다. ") +
    "문맥 미확인 CLI·원본 앱 답은 독립 정족수에 세지 않습니다. 합성은 여전히 모의 처리이며 사실 검증이 아닙니다.";
  if (opt.live) {
    document.getElementById("min").value = "1";
    if (opt.context_unverified) document.getElementById("policy").value = "include_unverified";
  }
  const box = document.getElementById("choices");
  for (const p of opt.participants) {
    const cb = h("input", { type: "checkbox", id: "p-" + p.pid,
      checked: opt.live ? p.transport === "cli" : ["claude", "codex", "chatgpt-app"].includes(p.pid) });
    const sel = p.transport === "cli" && !opt.live
      ? h("select", { id: "b-" + p.pid, "aria-label": p.label + " 모의 행동" },
          opt.behaviors.map(b => h("option", { value: b }, BEHAVIOR_LABEL[b] || b))) : null;
    box.append(h("label", { class: "row" }, cb, h("span", {}, p.label),
      h("span", { class: "meta" }, p.transport === "cli" ? (opt.live ? `실제 CLI · ${p.model}` : "CLI 모의") : "원본 앱 · 수동"), sel));
  }
}
document.getElementById("start").addEventListener("click", async () => {
  const err = document.getElementById("formerr"); err.textContent = "";
  const participants = [...document.querySelectorAll("#choices input:checked")].map(cb => {
    const pid = cb.id.slice(2), sel = document.getElementById("b-" + pid);
    return { pid, behavior: sel ? sel.value : "ok" };
  });
  try {
    const r = await api("/api/runs", { question: document.getElementById("question").value, participants,
                                       min_independent: +document.getElementById("min").value,
                                       quorum_policy: document.getElementById("policy").value });
    selected = r.run_id; await refresh();
  } catch (e) { err.textContent = e.message; }
});

function budget(run) {
  const b = run.budget, cells = [];
  for (let i = 0; i < b.breakdown.succeeded; i++) cells.push(h("span", { class: "cell ok", title: "받음" }));
  for (let i = 0; i < b.breakdown.failed; i++) cells.push(h("span", { class: "cell bad", title: "실패도 칸을 차지한다" }));
  for (let i = 0; i < b.breakdown.unknown; i++) cells.push(h("span", { class: "cell unk", title: "종료 미확인 — 0이 아니다" }));
  const running = b.used - b.breakdown.succeeded - b.breakdown.failed - b.breakdown.unknown;
  for (let i = 0; i < running; i++) cells.push(h("span", { class: "cell run", title: "실행 중" }));
  while (cells.length < b.cap) cells.push(h("span", { class: "cell" }));
  return h("div", { class: "pb", style: "border-bottom:1px solid var(--rule-100)" },
    h("div", { class: "caption" }, "외부 호출 예산 — 진척도가 아니라 소진량"),
    h("span", { class: "metric" }, `${b.used} / ${b.cap}`),
    h("div", { class: "budget" }, cells),
    h("div", { class: "caption" }, `받음 ${b.breakdown.succeeded} · 실패 ${b.breakdown.failed} · 종료 미확인 ${b.breakdown.unknown}` +
      (b.manual ? ` · 수동 ${b.manual}(우리 앱의 호출이 아님, 사용량 관측 안 됨)` : "")));
}

function participantRow(run, p) {
  const revealed = run.phase === "revealed";
  const label = p.status === "cancelled_before_start" ? "시작 전 취소"
    : p.status === "cancelled" ? "취소 · 종료 확인"
    : p.state === "accepted" && !revealed ? "제출됨" : (STATE_LABEL[p.state] || p.state);
  const who = h("div", { class: "who" }, h("span", {}, p.label),
    h("span", { class: "v" }, `${p.provider} · ${p.transport === "cli" ? (EXECUTION_LABEL[p.execution] || (p.state === "queued" ? "CLI · 실행 전" : "CLI · 실행 종류 미기록")) + (p.execution === "mock" && p.behavior && p.behavior !== "ok" ? " · " + (BEHAVIOR_LABEL[p.behavior] || p.behavior) : "") : "원본 앱 · 수동"}`),
    h("div", { class: "flags" }, p.contamination.map(c => h("span", { class: "flag" }, c))));
  if (p.state === "rejected" || p.state === "unknown") {
    who.append(h("div", { class: "kv" }, [p.status, p.detail, ...(p.result && p.result.notes || []),
      run.diagnostics_sealed ? "사유 원문은 모든 참여자가 끝난 뒤 보인다" : null].filter(Boolean).join(" · ")));
  }
  if (p.state === "unknown") {
    who.append(h("div", { style: "margin-top:6px" }, h("button", { class: "quiet", onclick: () => act(`/api/runs/${run.run_id}/acknowledge/${p.pid}`) },
      "종료를 직접 확인했음(예산은 돌려받지 않는다)")));
  }
  if (p.state === "awaiting_user" && run.gate.can_submit) {
    const key = run.run_id + "/" + p.pid;
    const ta = h("textarea", { rows: 4, placeholder: "원본 앱의 답을 붙여 넣는다", "aria-label": p.label + " 답",
                               oninput: e => { drafts[key] = e.target.value; } });
    ta.value = drafts[key] || "";
    const confirm = h("input", { type: "checkbox", "aria-label": p.label + " 입력 확인",
                                 onchange: e => { confirms[key] = e.target.checked; } });
    confirm.checked = !!confirms[key];
    const packetText = p.packet || run.prompt;
    who.append(h("div", { class: "manual" },
      h("div", { class: "caption" }, "1) 질문을 복사해 원본 앱에 붙여 넣는다  2) 받은 답을 아래에 붙여 넣는다. " +
        "복사한 질문 첫 줄의 표식(" + packetText.split("\n")[0] + ")을 답 첫 줄에 되말해 달라고 적혀 있다 — " +
        "다른 카드의 답을 붙여 넣으면 받지 않는다"),
      h("div", { style: "display:flex; gap:8px; flex-wrap:wrap" },
        h("button", { onclick: async e => { await navigator.clipboard.writeText(packetText); e.target.textContent = "복사함"; } }, "질문 복사"),
        h("button", { class: "quiet", onclick: () => act(`/api/runs/${run.run_id}/withdraw/${p.pid}`) }, "답을 받지 못함(빼기)")),
      ta,
      h("label", { class: "row" }, confirm, "원본 앱에 이 질문을 넣어 받은 답이다(기록만 한다 — 독립성 확인이 아니다)"),
      h("div", {}, h("button", { onclick: () => act(`/api/runs/${run.run_id}/manual/${p.pid}`,
        { text: ta.value, input_sha256: run.input_sha256, user_confirmed: confirm.checked })
        .then(ok => { if (ok) { delete drafts[key]; delete confirms[key]; } }) }, "답 넣기"),
        h("span", { class: "meta", style: "margin-left:8px" }, "입력 sha256 " + run.input_sha256.slice(0, 12)))));
  }
  if (revealed && p.draft != null) {
    const r = p.result;
    const manual = !r || r.source === "manual";
    const echo = { matched: "되말함", missing: "없음" };
    who.append(h("details", { open: true }, h("summary", {}, "초안 원문"),
      h("div", { class: "draft" }, p.draft),
      manual
        ? h("div", { class: "kv" }, "수동 제출 · 독립성 미확인 · " +
            (r ? `실행 표식 ${echo[r.marker_echo] || r.marker_echo} · 사용자 확인 ${r.user_confirmed ? "예" : "아니오"} · ` : "") +
            "사용량·시간 관측 안 됨")
        : h("div", { class: "kv" }, `독립성 확인(controller가 고정 입력만 주고 실행) · ` +
             `상태 ${r.state} · 종료 ${r.containment} ${r.tree_confirmed_empty ? "확인" : "미확인"} · 입력 ${r.input_delivery} · ` +
             `모델 ${r.requested_model || "?"} → ${r.reported_models && r.reported_models.length ? r.reported_models.join(", ") : "보고 없음"}` +
             `${r.model_match === false ? " (불일치)" : ""} · ` +
             `${r.duration_ms} ms · 사용량 ${r.usage && Object.keys(r.usage).length ? JSON.stringify(r.usage) : "관측 안 됨"}`)));
  }
  return h("div", { class: "p" }, who, h("span", { class: `label st-${p.state}` }, label));
}

function claimComparison(synthesis, run) {
  const labels = Object.fromEntries(run.participants.map(p => [p.pid, p.label]));
  const rows = synthesis.claims.map(claim => h("tr", {},
    h("td", {}, h("span", { class: "meta" }, claim.id), h("div", { class: "draft" }, claim.text)),
    h("td", {}, claim.references.map(ref => h("div", { class: "kv" },
      `${labels[ref.pid] || ref.pid} · 문자 ${ref.start}–${ref.end} · ${ref.sha256.slice(0, 8)}`))),
    h("td", {}, h("span", { class: "label" }, "미해결"), h("div", { class: "caption" }, "원문 일치 · 사실 미검증"))));
  return h("div", { class: "panel", "data-section": "comparison" },
    h("div", { class: "ph" }, h("span", { class: "t" }, "주장 대조 · 원문 일치 검사")),
    h("p", { class: "caption pb" }, "같은 문장은 묶되 사실로 판정하지 않습니다. 다른 입장·반례를 의미상 분류하지 않은 모의 대조입니다."),
    h("div", { class: "compare-scroll" }, h("table", { class: "comparison" },
      h("thead", {}, h("tr", {}, ["발췌 주장", "원문 위치", "판정"].map(s => h("th", { scope: "col" }, s)))),
      h("tbody", {}, rows))));
}

function decisionCard(synthesis) {
  const card = synthesis.card;
  const section = (title, items) => h("div", {}, h("strong", {}, title), h("ul", {}, items.map(x => h("li", {}, x))));
  return h("div", { class: "panel decision", "data-section": "decision" },
    h("div", { class: "ph" }, h("span", { class: "t" }, "결정 카드 · 모의 합성"),
      h("span", { class: "label" }, "조건부 · qualified")),
    h("div", { class: "pb" }, h("h3", {}, card.recommendation),
      section("뒤집을 조건", card.overturnedBy), section("미해결·반례", card.unresolved),
      section("다음 검사", card.nextChecks),
      h("p", { class: "caption" }, `주장 구성: 미해결 ${card.coverage.unresolved} · 외부 사실 검증 없음 · 추가 모델 호출 0`)));
}

function synthesisPanel(run) {
  const result = run.synthesis;
  if (!result) return h("div", { class: "pb" },
    h("button", { onclick: () => act(`/api/runs/${run.run_id}/synthesize`) }, "모의 합성 · 주장 대조 만들기"),
    h("p", { class: "caption" }, "공개된 원문을 발췌하고 원문 위치를 검사합니다. 모델 호출과 사실 검증은 하지 않습니다."));
  if (result.status !== "completed") return h("div", { class: "foot" },
    h("p", { class: "warn" }, result.message), h("p", { class: "caption" }, "합성 완료가 아닙니다. 아래 원문 보고서를 저장할 수 있습니다."));
  const controls = h("div", { class: "layout-controls", role: "group", "aria-label": "Q4 첫 화면 비교" },
    [ ["decision", "A · 결정 우선"], ["comparison", "B · 대조표 우선"] ].map(([key, label]) =>
      h("button", { class: "quiet", "aria-pressed": String(firstView === key), onclick: () => { firstView = key; render(); } }, label)));
  const card = decisionCard(result), table = claimComparison(result, run);
  return h("section", { "aria-label": "모의 합성 결과" }, controls,
    h("p", { class: "caption" }, "Q4 미결정 · 같은 결과의 순서만 바꾸어 비교합니다. 선택은 이 탭의 미리보기입니다."),
    ...(firstView === "decision" ? [card, table] : [table, card]),
    h("div", { class: "pb" }, h("button", { onclick: () => downloadReport(run.run_id, true) }, "결정 카드와 원문 저장(JSON)")));
}

function render() {
  if (!state) return;
  document.getElementById("status").textContent =
    `실행기 ${state.executor} · 실행 자리 ${state.slots.used}/${state.slots.cap} · 정리 안 된 시도 ${state.unsettled.count}/${state.unsettled.limit}` +
    (state.live_call_budget && state.live_call_budget.cap !== null
      ? ` · 실제 호출 예약 ${state.live_call_budget.used}/${state.live_call_budget.cap}` : "");
  // 다시 시작한 뒤에도 명시적으로 이어서 시작한다. 취소된 실행은 이 동작으로 되살리지 않는다.
  document.getElementById("resume").replaceChildren(state.paused
    ? h("button", { onclick: () => act("/api/resume"), title: "다시 시작하기 전에 시작하지 못한 시도를 이제 시작한다" }, "대기 중인 시도 이어서 시작")
    : "");
  const list = document.getElementById("runs"); list.replaceChildren();
  for (const run of state.runs) list.append(h("button", { "aria-current": run.run_id === selected, onclick: () => { selected = run.run_id; render(); } },
    h("span", { class: "meta" }, `${run.run_id} · ${run.cancel_requested ? "취소 요청됨" : (PHASE_LABEL[run.phase] || run.phase)}`), h("span", { class: "q" }, run.question)));
  const run = state.runs.find(r => r.run_id === selected) || state.runs[0];
  const detail = document.getElementById("detail");
  if (!run) return;
  selected = run.run_id;
  if (detail.contains(document.activeElement) && document.activeElement.tagName === "TEXTAREA") return; // 입력 중에는 다시 그리지 않는다
  const revealed = run.phase === "revealed";
  const done = run.participants.filter(p => p.state === "accepted").length;
  const panel = h("div", { class: "panel" + (revealed ? " revealed" : "") },
    h("div", { class: "ph" }, h("span", { class: "t" }, revealed ? "P1 · 독립 초안 · 공개됨" : "P1 · 독립 초안"),
      h("span", { class: "label", style: `color:var(${revealed ? "--ink-100" : "--sealed"})` },
        revealed ? `공개 ${done} / ${run.participants.length}` : `sealed ${done} / ${run.participants.length}`)),
    budget(run),
    run.participants.map(p => participantRow(run, p)),
    run.note ? h("div", { class: "foot" }, h("div", { class: "warn" }, run.note),
      run.gate.can_approve_reduction
        ? h("div", { style: "margin-top:8px" }, h("button", { onclick: () => act(`/api/runs/${run.run_id}/approve-reduction`) }, "축소 승인")) : null) : null);
  detail.replaceChildren(
    h("h2", {}, run.question),
    h("div", { class: "meta" }, `입력 sha256 ${run.input_sha256.slice(0, 16)}… · ${run.input_bytes} bytes · 최소 정족수 ${run.min_independent}명 · ${PHASE_LABEL[run.phase] || run.phase}`),
    h("p", { class: "caption" }, revealed
      ? "controller가 공개했다. 공개 전 초안은 서로 보지 않은 상태에서 받았다(수동 참여자는 blind 미확인)."
      : "공개 전에는 초안의 내용·길이·토큰 수를 화면에 넘기지 않는다. 공개는 controller가 정한다."),
    revealed && run.quorum && run.quorum.label ? h("p", { class: "caption" }, run.quorum.label) : "",  // replaceChildren은 null을 "null" 글자로 쓴다
    revealed ? synthesisPanel(run) : "",
    panel,
    run.gate.can_cancel ? h("div", { class: "pb" },
      h("button", { onclick: () => {
        if (confirm("이 실행을 되돌릴 수 없게 취소합니다. 받은 초안도 공개하지 않으며 이미 예약한 예산은 돌려받지 않습니다. 원본 앱 작업은 따로 중단해야 합니다."))
          act(`/api/runs/${run.run_id}/cancel`);
      } }, "이 실행 취소")) : "",
    run.cancel_requested ? h("p", { class: "caption" }, run.participants.some(p => p.state === "running" || p.state === "unknown")
      ? "취소 요청 저장됨 · 종료 대기/미확인 작업이 있습니다. 실행 자리는 종료 확인 뒤에만 풀립니다."
      : "취소 요청 저장됨 · controller에 종료 대기/미확인 시도는 없습니다. 초안은 계속 봉인됩니다. 원본 앱의 작업 종료는 별도입니다.") : "",
    revealed ? h("div", { class: "pb" },
      h("button", { onclick: () => downloadReport(run.run_id) }, "합성 없는 보고 저장(JSON · 원문 포함)"),
      h("p", { class: "caption" }, "이 원문 보고에는 합성 결과를 넣지 않습니다. 결정 카드 저장은 위에서 별도로 선택합니다. 사실 검증과 추가 모델 호출은 없습니다.")) : "",
    h("p", { class: "trail" }, "사건: " + run.events.join(" → ")));
}
async function downloadReport(runId, decision = false) {
  try {
    const report = await api(`/api/runs/${encodeURIComponent(runId)}/${decision ? "decision-report" : "report"}`);
    const url = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2) + "\n"], { type: "application/json;charset=utf-8" }));
    const link = h("a", { href: url, download: `${runId}-${decision ? "decision" : "without-synthesis"}.json` });
    document.body.append(link);
    try { link.click(); } finally { link.remove(); setTimeout(() => URL.revokeObjectURL(url), 0); }
  } catch (e) { alert(e.message); }
}
async function act(path, body) {
  try { await api(path, body || {}); await refresh(); return true; }
  catch (e) { alert(e.message); return false; }
}
async function refresh() {
  try { state = await api("/api/state"); render(); }
  catch (e) { document.getElementById("status").textContent = "연결 안 됨: " + e.message; }
}
if (!TOKEN) {
  document.getElementById("detail").replaceChildren(h("p", { class: "err" }, "토큰이 없습니다. 서버가 출력한 주소(#token=…)로 여세요."));
} else {
  loadOptions().then(refresh);
  setInterval(refresh, 1000);
}
</script>
</body>
</html>
