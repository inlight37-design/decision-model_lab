<!doctype html>
<html lang="ko" data-theme="glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger</title>
<script>
  // 테마는 이 창에만 기억한다(편의). 첫 그리기 전에 정해 번쩍임을 막는다.
  try { const t = localStorage.getItem("ledger-theme"); if (["light", "glass", "dusk"].includes(t)) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<!-- 글꼴: Pretendard 1.3.9 가변 글꼴을 저장소에 넣었다(fonts/LICENSE, SIL OFL). 인터넷 없이도 어느 PC에서나 같은 글꼴로 그린다 -->
<link rel="preload" href="/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<!-- island-ui(ai_unslop 저장소의 스킬)를 그대로 쓴다. 이 두 파일과 motion.js는 여기서 고치지 않는다 — island-ui/README.md -->
<link rel="stylesheet" href="/island-ui/themes.css">
<link rel="stylesheet" href="/island-ui/base.css">
<style>
@font-face { font-family: "Pretendard Variable"; font-style: normal; font-weight: 45 920; font-display: swap;
  src: url("/fonts/PretendardVariable.woff2") format("woff2"); }
/* ===== 화면 전용 스타일. 크기·간격·색은 island-ui 토큰만 쓴다 ===== */
* { box-sizing: border-box; }
button { border: none; background: none; }
h1, h2, h3, h4, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }

/* 창 크기: 900 이하 한 단 · 901~1599 두 단(옆 단 거의 고정, 본문이 늘어남) · 1600 이상 세 단(참여자가 옆으로) */
.page { max-width: 2400px; margin: 0 auto; padding: var(--s-4); }
@media (min-width: 601px) { .page { padding: var(--s-5); } }
@media (min-width: 901px) { .page { padding: var(--s-6); } }
@media (max-width: 900px) { .page { padding-bottom: calc(var(--s-8) + 64px); } }   /* 떠 있는 새 실행 버튼이 마지막 판을 가리지 않게 */

.layout { display: grid; gap: var(--s-5); align-items: start;
  grid-template-columns: minmax(0, 1fr); grid-template-areas: "main" "aside" "side"; }
.side { grid-area: side; } .main { grid-area: main; } .aside { grid-area: aside; }
.side, .main, .aside { display: flex; flex-direction: column; gap: var(--s-5); min-width: 0; }
.aside:empty { display: none; }
@media (min-width: 901px) {
  .layout { gap: var(--s-6); grid-template-columns: clamp(300px, 26vw, 380px) minmax(0, 1fr);
    grid-template-rows: auto 1fr; grid-template-areas: "side main" "side aside"; }
  .aside { margin-top: calc(var(--s-5) - var(--s-6)); }
}
@media (min-width: 1600px) {
  .layout { grid-template-columns: 380px minmax(0, 1.2fr) minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "side main aside"; }
  .aside { margin-top: 0; }
}

/* 섬과 칸: 바탕 위 흰 판(.island), 섬 안의 칸은 --surface-2 */
.island-block { border-radius: var(--r-island); padding: var(--s-5); }
@media (max-width: 600px) { .island-block { padding: var(--s-4); } .layout, .side, .main, .aside { gap: var(--s-4); } }
.block-title { font-size: var(--t-title-size); line-height: var(--t-title-lh); font-weight: 700; }
.block-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); flex-wrap: wrap; margin-bottom: var(--s-4); }
.cell { background: var(--surface-2); border-radius: var(--r-cell); padding: var(--s-3) var(--s-4); }
.stack { display: flex; flex-direction: column; gap: var(--s-2); }
.stack-lg { display: flex; flex-direction: column; gap: var(--s-4); }
.row { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--text-2); }
.cap { font-size: var(--t-cap-size); line-height: var(--t-cap-lh); }
.sm { font-size: var(--t-sm-size); line-height: var(--t-sm-lh); }
.lg { font-size: var(--t-lg-size); line-height: var(--t-lg-lh); }
.strong { font-weight: 700; }
.hash { word-break: break-all; }

/* 머리줄: Ledger · 모드 · 상태 알약(필요할 때만) · 테마 */
.header-island { border-radius: var(--r-island); padding: var(--s-4) var(--s-5); margin-bottom: var(--s-5);
  display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap; }
.header-top { display: flex; align-items: center; gap: var(--s-3); min-width: 0; flex-wrap: wrap; }
.brand-name { font-size: var(--t-title-size); line-height: var(--t-title-lh); font-weight: 700; }
.pill { display: inline-flex; align-items: center; gap: var(--s-1); padding: var(--s-1) var(--s-3);
  border-radius: var(--r-pill); background: var(--surface-2); font-size: var(--t-sm-size); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill-mode { background: var(--tint-blue); color: var(--on-tint-blue); font-weight: 600; }
.pill-live { background: var(--tint-orange); color: var(--on-tint-orange); font-weight: 600; }
.pill-warn { background: var(--tint-orange); color: var(--on-tint-orange); font-weight: 600; }
.status-row { display: flex; gap: var(--s-2); flex-wrap: wrap; align-items: center; flex: 1 1 auto; min-width: 0; }
@media (max-width: 600px) {
  .header-island { padding: var(--s-4); margin-bottom: var(--s-4); }
  .header-top { flex: 1 1 auto; }
  .status-row { order: 5; flex: 1 1 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .status-row::-webkit-scrollbar { display: none; }
  .status-row:empty { display: none; }
}

/* 버튼 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  padding: var(--s-2) var(--s-4); border-radius: var(--r-pill); font-size: var(--t-sm-size); font-weight: 600;
  background: var(--surface-2); color: var(--text); text-align: center; line-height: 1.4; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-brand { background: var(--brand); color: var(--on-brand); }
.btn-danger { background: var(--tint-violet); color: var(--on-tint-violet); }
.btn-block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* 알약 구간 선택 */
.seg { position: relative; display: inline-flex; background: var(--surface-2); border-radius: var(--r-pill);
  padding: var(--s-1); gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { position: relative; z-index: 1; padding: var(--s-1) var(--s-3); border-radius: var(--r-pill);
  font-size: var(--t-sm-size); white-space: nowrap; color: var(--text-2); }
.seg button[aria-selected="true"] { color: var(--text); font-weight: 600; }
@media (max-width: 600px) { .seg button { padding: var(--s-1) var(--s-2); } }
.seg-indicator { position: absolute; top: var(--s-1); bottom: var(--s-1); left: 0; width: 0; background: var(--surface);
  border-radius: var(--r-pill); box-shadow: var(--shadow-float); z-index: 0; }

/* 새 실행: 넓은 화면은 섬 안 버튼 → 제자리 양식, 좁은 화면은 떠 있는 + 버튼 → 떠 있는 패널 */
.new-run-island { position: relative; }
.new-run-btn { width: 100%; padding: var(--s-3) var(--s-4); border-radius: var(--r-pill); background: var(--brand);
  color: var(--on-brand); font-weight: 700; display: flex; align-items: center; justify-content: center; gap: var(--s-2); }
.nr-icon { display: none; font-size: var(--t-num-size); line-height: 1; font-weight: 400; }
.new-run-panel { position: relative; }
.new-run-panel .block-title { margin-bottom: var(--s-4); padding-right: var(--s-7); }
@media (max-width: 900px) {
  .new-run-island { display: contents; }
  .new-run-btn { position: fixed; right: var(--s-5); bottom: var(--s-5); width: 56px; height: 56px; padding: 0;
    border-radius: 50%; box-shadow: var(--shadow-float); z-index: 6; }
  .new-run-btn .nr-label { display: none; }
  .nr-icon { display: block; }
  .new-run-panel { position: fixed; left: var(--s-4); right: var(--s-4); bottom: calc(var(--s-5) + 72px);
    max-height: 72vh; overflow-y: auto; z-index: 6; border-radius: var(--r-island); padding: var(--s-5);
    background: var(--surface); backdrop-filter: var(--surface-blur); box-shadow: var(--surface-edge), var(--shadow-float); }
}
.form-field { display: flex; flex-direction: column; gap: var(--s-2); }
.form-label { font-size: var(--t-sm-size); font-weight: 600; }
textarea, select, input[type="number"] {
  font: inherit; font-size: var(--t-body-size); border-radius: var(--r-cell); border: 1px solid var(--line);
  background: var(--surface-2); color: var(--text); padding: var(--s-3); width: 100%; }
select { padding: var(--s-2) var(--s-3); }
textarea { min-height: 96px; resize: vertical; }
textarea::placeholder { color: var(--text-2); }
input[type="checkbox"] { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--primary); }
.checkbox-row { display: flex; align-items: flex-start; gap: var(--s-2); cursor: pointer; }
.close-x { position: absolute; top: 0; right: 0; width: 32px; height: 32px; border-radius: 50%;
  background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: var(--t-lg-size); }
@media (max-width: 900px) { .close-x { top: var(--s-4); right: var(--s-4); } }
.pick-behavior { margin-top: var(--s-2); padding-left: var(--s-7); }
.error-line { color: var(--on-tint-orange); background: var(--tint-orange); border-radius: var(--r-cell); padding: var(--s-2) var(--s-3); font-weight: 600; }
.error-line:empty { display: none; }

/* 파일 고르기: 브라우저 기본 '파일 선택' 대신. 칸 전체가 끌어다 놓는 자리 */
.file-drop { display: flex; flex-direction: column; gap: var(--s-3); padding: var(--s-3); border-radius: var(--r-cell); background: var(--surface-2); }
.file-drop.is-over { background: var(--primary-soft); box-shadow: inset 0 0 0 2px var(--primary); }
.file-list { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.file-list:empty { display: none; }
.file-chip { display: inline-flex; align-items: center; gap: var(--s-2); max-width: 100%; background: var(--surface);
  border-radius: var(--r-pill); padding: var(--s-1) var(--s-1) var(--s-1) var(--s-3); font-size: var(--t-sm-size); }
.file-chip .mono { overflow-wrap: anywhere; }
.file-chip button { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--surface-2); color: var(--text-2); }
.file-pick-row { display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap; }
.file-pick { display: inline-flex; align-items: center; gap: var(--s-2); padding: var(--s-2) var(--s-4); border-radius: var(--r-pill);
  background: var(--surface); color: var(--text); font-size: var(--t-sm-size); font-weight: 600; }
.file-pick .plus { font-size: var(--t-lg-size); line-height: 1; color: var(--primary); }
.file-note { color: var(--on-tint-orange); font-weight: 600; }
.file-note:empty, .source-note:empty { display: none; }

/* 실행 목록 */
.run-row { width: 100%; text-align: left; border-radius: var(--r-cell); padding: var(--s-3) var(--s-4);
  background: var(--surface-2); display: flex; flex-direction: column; gap: var(--s-1); }
.run-row[aria-current="true"] { background: var(--primary-soft); box-shadow: inset 0 0 0 2px var(--primary); }
.run-row + .run-row { margin-top: var(--s-2); }
.run-q { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }   /* 목록의 한 줄 요약만 말줄임 */
.run-tabs { display: none; }
@media (max-width: 900px) {
  .run-tabs { display: flex; gap: var(--s-2); overflow-x: auto; scrollbar-width: none; margin-bottom: var(--s-4); }
  .run-tabs::-webkit-scrollbar { display: none; }
  .run-tabs button { flex: 0 0 auto; max-width: 220px; overflow: hidden; text-overflow: ellipsis; padding: var(--s-2) var(--s-4);
    border-radius: var(--r-pill); background: var(--surface); box-shadow: var(--surface-edge); font-size: var(--t-sm-size); white-space: nowrap; color: var(--text-2); }
  .run-tabs button[aria-current="true"] { background: var(--primary); color: var(--on-primary); }
  .run-tabs:empty { display: none; }
}

/* 배지: 옅은 바탕 + 같은 계열 진한 글자. 진한 판정 색은 점으로만 */
.badge { display: inline-flex; align-items: center; gap: var(--s-1); padding: var(--s-1) var(--s-3);
  border-radius: var(--r-pill); font-size: var(--t-sm-size); font-weight: 700; white-space: nowrap; }
.badge-unresolved { background: var(--tint-orange); color: var(--on-tint-orange); }
.badge-unresolved::before, .badge-missing::before, .flag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--unresolved); flex: none; }
.badge-missing::before { background: var(--failed); }
.badge-qualified { background: var(--tint-blue); color: var(--on-tint-blue); }
.badge-rejected { background: var(--tint-violet); color: var(--on-tint-violet); }
.badge-missing { background: var(--surface-3); color: var(--text); }
.badge-neutral { background: var(--surface-3); color: var(--text-2); }
.flag { display: inline-flex; align-items: center; gap: var(--s-1); padding: 0 var(--s-2); border-radius: var(--r-pill);
  background: var(--tint-orange); color: var(--on-tint-orange); font-weight: 700; }
.tag { display: inline-flex; align-items: center; padding: 2px var(--s-3); border-radius: var(--r-pill);
  background: var(--tint-orange); color: var(--on-tint-orange); font-size: var(--t-cap-size); font-weight: 600; }
.cell-alert { background: var(--tint-orange); color: var(--on-tint-orange); }
.cell-alert .muted { color: var(--on-tint-orange); }

/* 질문 섬 */
.run-question { font-size: var(--t-title-size); line-height: var(--t-title-lh); font-weight: 700; }
.meta-line { margin-top: var(--s-2); font-size: var(--t-sm-size); color: var(--text-2); font-variant-numeric: tabular-nums; }
.island-part { margin-top: var(--s-4); }

/* 결정 카드: 글자·숫자·점은 카드 색의 짝 토큰만 */
.hero-card { border-radius: var(--r-island); padding: var(--s-6); background: linear-gradient(150deg, var(--hero-1), var(--hero-2));
  backdrop-filter: var(--hero-blur); box-shadow: var(--hero-shadow); border: 1px solid var(--hero-line); color: var(--on-hero); }
@media (max-width: 600px) { .hero-card { padding: var(--s-5); } }
.hero-recommend { font-size: var(--t-hero-size); line-height: var(--t-hero-lh); font-weight: 700; margin: var(--s-4) 0; }
.hero-sub { color: var(--on-hero-2); }
.hero-label { font-weight: 700; }
.hero-chip { background: var(--hero-chip-bg); border-radius: var(--r-pill); padding: var(--s-1) var(--s-3);
  display: inline-flex; align-items: center; gap: var(--s-1); font-size: var(--t-sm-size); font-weight: 700; }
.hero-chip-dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--hero-count); flex: none; }
.hero-count { font-size: var(--t-num-size); line-height: var(--t-num-lh); font-weight: 700; color: var(--hero-count); font-variant-numeric: tabular-nums; }
.hero-count-row { display: flex; align-items: center; gap: var(--s-3); width: 100%; text-align: left; color: inherit;
  padding: var(--s-3) var(--s-4); border-radius: var(--r-cell); background: var(--hero-chip-bg); font-weight: 700; }
.hero-count-row .chev { margin-left: auto; transition: transform .2s ease; }
.hero-count-row[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.hero-list { display: flex; flex-direction: column; gap: var(--s-2); margin-top: var(--s-2); }
.hero-list-item { padding: var(--s-3); background: var(--hero-chip-bg); border-radius: var(--r-cell); }
.hero-divider { height: 1px; background: var(--hero-line); margin: var(--s-5) 0; }

/* 접기 */
.collapse-toggle { display: flex; align-items: center; gap: var(--s-2); width: 100%; text-align: left;
  padding: var(--s-3) var(--s-4); border-radius: var(--r-cell); background: var(--surface-2); font-weight: 600; font-size: var(--t-sm-size); }
.collapse-toggle .chev { transition: transform .2s ease; margin-left: auto; }
.collapse-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
.collapse-box { height: 0; overflow: hidden; }
.collapse-inner { padding: var(--s-3) var(--s-1) var(--s-1); display: flex; flex-direction: column; gap: var(--s-2); }
.collapse + .collapse { margin-top: var(--s-2); }

/* 주장 대조표: 가로 스크롤 없이, 표를 감싼 판의 폭(@container)에 맞춰 행을 다시 흘린다 */
.claims { container-type: inline-size; }
.claims-head { display: none; }
.claim-row { display: grid; gap: var(--s-2) var(--s-3); padding: var(--s-3) var(--s-4); border-radius: var(--r-cell); font-size: var(--t-sm-size);
  grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "id verdict" "text text" "loc loc"; }
.claim-row:nth-child(even) { background: var(--surface-2); }
.claim-id { grid-area: id; align-self: center; } .claim-text { grid-area: text; } .claim-loc { grid-area: loc; color: var(--text-2); }
.claim-verdict { grid-area: verdict; display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-1) var(--s-2); }
.claim-loc .ref { display: block; }
.claim-loc .ref span { white-space: nowrap; }
@container (min-width: 480px) {
  .claim-row { grid-template-columns: 48px minmax(0, 1fr) 128px; grid-template-areas: "id text verdict" ". loc verdict"; }
  .claim-id { align-self: start; }
  .claim-verdict { flex-direction: column; align-items: flex-start; align-self: start; }
}
@container (min-width: 720px) {
  .claims-head { display: grid; gap: var(--s-3); padding: 0 var(--s-4) var(--s-2); font-size: var(--t-cap-size); font-weight: 600; color: var(--text-2);
    grid-template-columns: 48px minmax(0, 1fr) minmax(176px, 28%) 128px; }
  .claim-row { grid-template-columns: 48px minmax(0, 1fr) minmax(176px, 28%) 128px; grid-template-areas: "id text loc verdict"; }
}

/* 실제 합성의 인용 목록 */
.quote { padding-left: var(--s-3); border-left: 2px solid var(--line); }
.claim-line { font-weight: 700; margin-top: var(--s-2); }

/* 참여자 */
.participant-card { border-radius: var(--r-cell); background: var(--surface-2); padding: var(--s-4); display: flex; flex-direction: column; gap: var(--s-2); }
.participant-card + .participant-card { margin-top: var(--s-3); }
.draft-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: var(--t-sm-size); background: var(--surface); border-radius: var(--r-cell); padding: var(--s-3); }
.info-list { display: flex; flex-direction: column; gap: var(--s-1); font-size: var(--t-cap-size); line-height: var(--t-cap-lh); color: var(--text-2); }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-2); }
.stat-box { background: var(--surface); border-radius: var(--r-cell); padding: var(--s-3); text-align: center; }
.stat-num { font-size: var(--t-title-size); font-weight: 700; font-variant-numeric: tabular-nums; }

/* 계정 한도: provider마다 카드 하나, 창마다 게이지 한 줄(쓴 비율). 지난 값은 회색, 모르는 값은 막대 없이 '미확인' */
.quota-card { background: var(--surface-2); border-radius: var(--r-cell); padding: var(--s-4); display: flex; flex-direction: column; gap: var(--s-3); }
.quota-head { display: flex; align-items: baseline; gap: var(--s-2); flex-wrap: wrap; }
.quota-head .lg { font-weight: 700; margin-right: auto; }
.pill-quiet { background: var(--surface); color: var(--text-2); padding: 0 var(--s-2); }
.quota-alert { background: var(--tint-orange); color: var(--on-tint-orange); border-radius: var(--r-cell); padding: var(--s-2) var(--s-3);
  display: flex; gap: var(--s-2); align-items: baseline; font-weight: 600; max-inline-size: none; }
.quota-alert::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--unresolved); flex: none; transform: translateY(-1px); }
.quota-alert.fail::before { background: var(--failed); }
.gauges { display: flex; flex-direction: column; gap: var(--s-3); }
.gauge-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; grid-template-areas: "label bar num" ". reset reset";
  align-items: center; column-gap: var(--s-3); row-gap: 2px; }
.gauge-label { grid-area: label; color: var(--text-2); font-weight: 600; }

// 경고할 크기를 정하지 않는다 — 두 표본뿐이라 관측을 그대로 적는다. sizes는 파일별 바이트 수.

  return `자료 ${sizes.length}개 · 합계 ${shown}` + (claudeLive

      "약 1,043 KB에서는 제한 시간 180초를 넘겨 답을 받지 못했습니다. Codex는 둘 다 35초 안이었습니다."

function addFiles(files) {
  const refused = [];
  for (const file of files) {
    const ext = "." + file.name.split(".").pop().toLowerCase();
    const total = picked.reduce((sum, f) => sum + f.size, 0);
    if (!SOURCE_EXT.includes(ext)) refused.push(`${file.name}: 받지 않는 형식`);
    else if (file.size > SOURCE_LIMITS.each) refused.push(`${file.name}: 256 KiB 넘음`);
    else if (picked.length >= SOURCE_LIMITS.count) refused.push(`${file.name}: 20개 넘음`);
    else if (total + file.size > SOURCE_LIMITS.total) refused.push(`${file.name}: 합계 1 MiB 넘음`);

  if (gate.status === "reduction_required") return ["승인 필요", "badge-unresolved"];
  if (gate.status === "quorum_blocked") return ["정족수 부족", "badge-missing"];
  if (ps.some(p => p.state === "running" || p.state === "queued")) return ["답 받는 중", "badge-neutral"];
  if (ps.some(p => p.state === "awaiting_user")) return ["붙여넣기 대기", "badge-neutral"];

      title: "다시 시작하기 전에 시작하지 못한 시도를 이제 시작한다" }, "대기 중인 시도 이어서 시작"));
  }
  if (connection) pills.push(h("span", { class: "pill pill-warn", title: connection }, "서버 연결 안 됨"));
  const theme = document.documentElement.dataset.theme;
  $("header").replaceChildren(
    h("div", { class: "header-top" }, h("h1", { class: "brand-name" }, "Ledger"),
      h("span", { class: "pill " + (!optionsLoaded ? "" : liveMode ? "pill-live" : "pill-mode"), title: state ? `실행기 ${state.executor}` : null }, modeLabel())),
    h("div", { class: "status-row" }, pills),
    h("div", { class: "seg", id: "themeSeg", role: "tablist", "aria-label": "테마", style: "margin-left:auto" },
      h("span", { class: "seg-indicator" }),
      THEMES.map(([key, label]) => h("button", { type: "button", role: "tab", "aria-selected": String(theme === key),
        onclick: e => setTheme(key, e.currentTarget) }, label))));
  placeIndicator($("themeSeg"));
  pressAll($("header"));
}
// 질문 섬: 질문 · 한 줄 요약 · 해야 할 일(승인·취소) · 공개 뒤 정족수와 보기 순서. 해시·사건 기록은 '실행 정보'에 접어 둔다.
function questionIsland(run) {
  const gate = run.gate || {}, revealed = run.phase === "revealed";
  const [label, cls] = runStatus(run);
  const sources = run.sources || [];
  const parts = [
    h("div", { class: "row between" }, badge(label, cls), h("span", { class: "cap muted" }, fmtTime(run.created_at))),
    h("h2", { class: "run-question", style: "margin-top:var(--s-3)" }, run.question),
    h("p", { class: "meta-line" }, `참여자 ${run.participants.length}명` + (sources.length ? ` · 공통 자료 ${sources.length}개` : "") +
      ` · 최소 정족수 ${run.min_independent}명`)];
  if (run.cancel_requested) {
    parts.push(h("div", { class: "cell island-part stack" }, h("p", { class: "sm strong" }, run.note || "취소를 요청했습니다."),
      h("p", { class: "cap muted" }, run.participants.some(p => p.state === "running" || p.state === "unknown")
        ? "취소 요청 저장됨 · 종료 대기/미확인 작업이 있습니다. 실행 자리는 종료 확인 뒤에만 풀립니다."
        : "취소 요청 저장됨 · controller에 종료 대기/미확인 시도는 없습니다. 초안은 계속 봉인됩니다. 원본 앱의 작업 종료는 별도입니다.")));
  } else if (!revealed) {
    if (gate.status === "waiting")
      parts.push(h("p", { class: "sm muted island-part" }, "모두 끝나면 한꺼번에 공개합니다. 그 전에는 누구의 답도 보이지 않습니다(봉인)."));
    if (run.note) parts.push(h("div", { class: "cell cell-alert island-part stack" }, h("p", { class: "sm strong" }, run.note),
      gate.can_approve_reduction ? h("div", {}, h("button", { class: "btn btn-primary", type: "button", onclick: () => {
        if (window.confirm("빠진 참여자 없이 남은 답으로 공개를 진행합니다. 되돌릴 수 없습니다.")) act(`/api/runs/${run.run_id}/approve-reduction`);
      } }, "축소 승인")) : null));
  }
  if (revealed && run.quorum && run.quorum.label) parts.push(h("p", { class: "sm strong island-part" }, run.quorum.label));
  if (revealed && run.synthesis && run.synthesis.status === "completed" && run.synthesis.mode !== "model") {
    parts.push(h("div", { class: "island-part row" },
      h("div", { class: "seg", id: "orderSeg", role: "tablist", "aria-label": "보기 순서" }, h("span", { class: "seg-indicator" }),
        [["decision", "A · 결정 우선"], ["comparison", "B · 대조표 우선"]].map(([key, text]) =>
          h("button", { type: "button", role: "tab", "aria-selected": String(firstView === key), onclick: e => {
            if (firstView === key) return;
            placeIndicator($("orderSeg"), e.currentTarget); firstView = key; render();
          } }, text))),
      h("span", { class: "cap muted" }, "Q4 미결정 · 같은 결과의 순서만 바꿉니다")));
  }
  const info = [
    h("p", {}, roleSummary(run.role_config)),
    h("p", {}, "입력 모드: 원문 · 역할 구성은 시작할 때 고정됨"),
    h("p", {}, "실행 ID ", h("span", { class: "mono hash" }, run.run_id)),
    h("p", {}, "입력 sha256 ", h("span", { class: "mono hash" }, run.input_sha256), ` · ${run.input_bytes}바이트`),
    h("p", {}, `정족수 정책: ${run.quorum && run.quorum.policy === "include_unverified" ? "미확인 답도 셈" : "독립성이 확인된 참여자만"}`),
    sources.length ? h("p", {}, "공통 자료(읽기 전용, 시도마다 해시 확인)") : null,
    sources.map(s => h("p", {}, h("span", { class: "mono" }, s.name), ` · ${s.bytes}바이트 · sha256 `, h("span", { class: "mono hash" }, s.sha256.slice(0, 12) + "…"))),
    revealed ? h("p", {}, "controller가 공개했다. 공개 전 초안은 서로 보지 않은 상태에서 받았다(수동 참여자는 blind 미확인).") : null,
    h("p", {}, "사건: " + run.events.join(" → "))];
  parts.push(h("div", { class: "island-part" }, collapsible(`info-${run.run_id}`, "실행 정보 · 사건 기록", h("div", { class: "info-list" }, info))));
  if (gate.can_cancel) parts.push(h("div", { class: "island-part" }, h("button", { class: "btn btn-danger", type: "button", onclick: () => {
    if (window.confirm("이 실행을 되돌릴 수 없게 취소합니다. 받은 초안도 공개하지 않으며 이미 예약한 예산은 돌려받지 않습니다. 원본 앱 작업은 따로 중단해야 합니다."))
      act(`/api/runs/${run.run_id}/cancel`);
  } }, "이 실행 취소")));
  return island(null, parts);
}
function renderRun(run) {
  const sig = JSON.stringify([run, firstView, liveMode, synthesizers.length]);
  if (sig === runSig) return;
  // 입력 중에는 다시 그리지 않는다(글자·커서가 사라진다). 다음 새로고침에 그린다.
  const active = document.activeElement;
  if (active && /^(TEXTAREA|INPUT|SELECT)$/.test(active.tagName) && ($("mainCol").contains(active) || $("asideCol").contains(active))) return;
  runSig = sig;
  if (!run) return;
  const revealed = run.phase === "revealed";
  $("mainCol").replaceChildren(questionIsland(run), ...(revealed ? [...synthesisPanel(run),
    island("내 차례 · 공개 뒤 판단", run.reviewed ? h("p", { class: "sm" }, "판단 완료로 표시했습니다. 추가 질문은 작업에서 새 실행으로 이어 가세요.") :
      [h("p", { class: "sm muted" }, "원문을 확인하고 이번 실행을 마칠지, 새 실행으로 이어 갈지 정하세요."),
       h("button", { type: "button", class: "btn btn-primary", onclick: () => act(`/api/runs/${run.run_id}/reviewed`) }, "판단 완료")]),
    saveIsland(run)] : []).filter(Boolean));
  $("asideCol").replaceChildren(participantsIsland(run));
  pressAll($("mainCol")); pressAll($("asideCol"));
  placeIndicator($("orderSeg"));
}
function render() {
  renderHeader();
  if (!state) return;
  const run = state.runs.find(r => r.run_id === selected) || null;
  if (run) taskSelected = run.task_id;
  renderTaskNavigation();
  if (run) renderRun(run); else renderTaskPage();
}

// ---- 동작 ------------------------------------------------------------------------------------------
let toastSpring = null, toastTimer = 0;
function toast(text, error = false) {
  const el = $("toast");
  el.textContent = text; el.classList.toggle("is-error", error); el.hidden = false;
  const paint = v => { el.style.transform = `translate(-50%, ${(1 - v) * 24}px)`; el.style.opacity = String(Math.max(0, Math.min(1, v))); };
  toastSpring = toastSpring || createSpring(0, paint);
  toastSpring.to(1, FEEL.rare);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastSpring.to(0, { response: FEEL.rare.response, damping: 1, onRest: () => { el.hidden = true; } }), error ? 7000 : 4000);
}
async function downloadReport(runId, decision = false) {
  try {
    const report = await api(`/api/runs/${encodeURIComponent(runId)}/${decision ? "decision-report" : "report"}`);
    const url = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2) + "\n"], { type: "application/json;charset=utf-8" }));
    const link = h("a", { href: url, download: `${runId}-${decision ? "decision" : "without-synthesis"}.json` });
    document.body.append(link);
    try { link.click(); } finally { link.remove(); setTimeout(() => URL.revokeObjectURL(url), 0); }
  } catch (e) { toast(e.message, true); }
}
async function act(path, body) {
  try { await api(path, body || {}); await refresh(); return true; }
  catch (e) { toast(e.message, true); return false; }
}
async function refresh() {
  try {
    const [next, quota] = await Promise.all([api("/api/state"), api("/api/account-quota")]);
    connection = ""; state = next; render(); renderQuota(quota);
    // 실제 CLI 시도가 끝나면 계정 사용량이 바뀌었으니 Codex 값을 새로 받는다
    const settled = next.runs.reduce((n, r) => n + r.participants.filter(p => p.execution === "real" &&
      ["accepted", "rejected"].includes(p.state)).length, 0);
    if (settledSeen !== null && settled > settledSeen) autoQuota("run");
    settledSeen = settled;
  } catch (e) { connection = String(e.message); renderHeader(); }
}
async function loadOptions() {
  const opt = await api("/api/options");
  liveMode = !!opt.live;
  contextUnverified = !!opt.context_unverified;
  synthesizers = [...new Map((opt.participants || []).filter(p => p.transport === "cli" && p.adapter_id)
    .map(p => [p.adapter_id, p])).values()];
  optionsLoaded = true;
  document.title = opt.live ? "Ledger 실제 CLI" : "Ledger 모의 모드";
  initNewRun(opt);
}
function openNewRun(taskId = null) {
  if (!roleOptions) return;
  composeTask = taskId; chosenCard = null; initNewRun(roleOptions); invalidatePreview();
  $("formErr").textContent = ""; $("roleNotice").textContent = "";
  $("composeTitle").textContent = taskId ? "이 작업에 새 실행" : "새 작업";
  $("taskTitleField").hidden = !!taskId;
  $("taskTitle").value = ""; $("question").value = ""; picked = []; renderPicked("");
  $("composeDialog").showModal(); $("newRunBtn").setAttribute("aria-expanded", "true");
  (taskId ? $("question") : $("taskTitle")).focus();
}
$("newRunBtn").addEventListener("click", () => openNewRun());
$("newRunClose").addEventListener("click", closeNewRun);
$("composeDialog").addEventListener("close", () => { $("newRunBtn").setAttribute("aria-expanded", "false"); invalidatePreview(); });
$("newRunPanel").addEventListener("input", invalidatePreview);
$("newRunPanel").addEventListener("change", invalidatePreview);
$("startBtn").addEventListener("click", startRun);
$("filePick").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", e => { addFiles([...e.target.files]); e.target.value = ""; });
const drop = $("fileDrop");
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("is-over"); });
drop.addEventListener("dragleave", e => { if (!drop.contains(e.relatedTarget)) drop.classList.remove("is-over"); });
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("is-over"); addFiles([...e.dataTransfer.files]); });
pressAll($("newRunIsland"));
stickyColumn($("sideCol"));
// 글꼴이 늦게 오거나 창 폭이 바뀌면 글자 폭이 달라지므로 선택 표시를 다시 놓는다
const placeIndicators = () => { placeIndicator($("themeSeg")); placeIndicator($("orderSeg")); };
addEventListener("resize", placeIndicators);
if (document.fonts) document.fonts.ready.then(placeIndicators);

if (!TOKEN) {
  $("mainCol").replaceChildren(island("연결 정보가 없습니다", [
    h("p", { class: "sm" }, "바탕 화면의 Decision Lab 아이콘으로 다시 열어 주세요."),
    h("p", { class: "cap muted island-part" }, "직접 띄웠다면 서버가 출력한 주소(#token=…)로 엽니다.")]));
  renderHeader();
} else {
  renderHeader();
  loadOptions().then(refresh).catch(e => { connection = String(e.message); renderHeader(); });
  setInterval(refresh, 1000);
}
</script>
