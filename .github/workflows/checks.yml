# 오프라인 검사만 실행한다. 모델·구독·네트워크·sandbox를 검증하지 않는다.
name: offline-checks

# PR(main과 합친 결과)과 main에서만 돈다. 예전에는 브랜치 push에서도 돌아 PR의 같은 커밋을 두 번씩 검사했다.
# 병합 판단에 쓰는 것은 PR 실행이고, main 실행은 병합 뒤 확인이다. PR을 열기 전에는 Actions 탭에서 손으로 돌린다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 PR에 새 커밋이 오면 앞 실행을 멈춘다. main은 병합마다 끝까지 돈다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # pre-commit hook 이 --no-verify 로 우회됐을 때의 뒷단.
      - name: text encoding
        run: python tools/check_encoding.py

      # 잘못된 값 하나가 토큰을 통째로 드롭시키는데 화면에서는 티가 나지 않는다.
      - name: design tokens
        run: python tools/validate_design_tokens.py

      # 표준 라이브러리만으로 동작해야 하는 경로를 의존성 설치 전에 먼저 확인한다.
      - name: stdlib-only frontier checker
        run: |
          python tools/check_frontier_protocol.py
          python -m unittest discover -s tests -p 'test_frontier_protocol.py'

      # 메인 PC에서 clone 직후 pip 없이 돌아가야 한다. dry-run 은 아무것도 실행하지 않는다.
      - name: stdlib-only runtime inventory (V04-01)
        run: |
          python tools/runtime_inventory.py --host-label ci --dry-run
          python -m unittest discover -s tests -p 'test_runtime_inventory.py'

      - name: install design dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-design.txt

      - name: v0.1 contract checks
        run: python tools/validate_design.py

      - name: v0.2 pilot/proof checks
        run: python tools/validate_v02.py

      - name: evidence registry schema
        run: python tools/validate_sources.py

      # core.isolation 시험(W2)이 건너뛰지 않고 돌게 한다. Ubuntu 24.04 러너는 AppArmor가 권한 없는
      # user namespace를 막으므로 그 제한을 푼다. 마지막 줄이 실패하면 격리 시험을 못 도는 것이다.
      - name: bubblewrap for isolation tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-all --share-net --die-with-parent --ro-bind /usr /usr --symlink usr/bin /bin \
            --symlink usr/lib /lib --symlink usr/lib64 /lib64 --proc /proc -- /usr/bin/true

      # DML_REQUIRE_BWRAP=1: 격리 시험을 건너뛰어 녹색이 되지 않게 한다(WSL2 리뷰 Q7).
      - name: full test suite
        env:
          DML_REQUIRE_BWRAP: "1"
        run: python -m unittest discover -s tests -v

      - name: compile
        run: python -m compileall -q tools tests core app

      # 문서에 hash를 고정하는 대신 실행마다 현재 값을 기록한다.
      - name: record current code hashes
        run: python tools/print_code_hashes.py

  windows-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install design dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-design.txt
      - name: text encoding
        run: python tools/check_encoding.py
      # 사용자 PC는 Windows다. 인계 6절의 검증 도구도 CP1252 출력에서 한글 결과 줄 때문에 끝나지 않아야 한다.
      # 단계를 나눈다: PowerShell의 여러 줄 run은 마지막 명령의 종료 코드만 본다.
      - name: design tokens
        run: python tools/validate_design_tokens.py
      - name: frontier checker
        run: python tools/check_frontier_protocol.py
      - name: runtime inventory dry-run
        run: python tools/runtime_inventory.py --host-label ci --dry-run
      - name: v0.1 contract checks
        run: python tools/validate_design.py
      - name: v0.2 pilot/proof checks
        run: python tools/validate_v02.py
      - name: evidence registry schema
        run: python tools/validate_sources.py
      # Windows regressions are separate from Linux bubblewrap checks; OS-specific skips are explicit.
      - name: full Windows test suite
        run: python -m unittest discover -s tests -v
      - name: compile
        run: python -m compileall -q tools tests core app
