name: review-source-export
on:
  push:
    branches: [chatgpt/runtime-review-20260925]
    paths: [.github/workflows/review-source-export.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz --output=review-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: review-source
          path: review-source.tar.gz
          retention-days: 1
          if-no-files-found: error
