# Temporary, branch-scoped source transfer. It removes itself in the resulting commit.
name: cli-breakthrough-apply
on:
  push:
    branches: ["chatgpt/cli-breakthrough-20260924"]
    paths: [".github/workflows/cli-breakthrough-apply.yml"]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/chatgpt/cli-breakthrough-20260924'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and materialize exact tested source
        shell: bash
        run: |
          git diff --exit-code d6c87cf55949dd864da32b6969821af277c37a44 HEAD -- . ':!.github/cli-breakthrough-*.b64' ':!.github/workflows/cli-breakthrough-apply.yml'
          python - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          root = Path.cwd().resolve()
          payload = ''.join(Path(f'.github/cli-breakthrough-{i}.b64').read_text().strip() for i in range(8))
          raw = gzip.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '7b98a46b207e7b2168a84e1ddec0be68f37a4ed07df0b7c99292f0ca49c32d86'
          prepared = []
          for edit in json.loads(raw):
              path = (root / edit['path']).resolve()
              assert path.is_relative_to(root) and '.git' not in path.relative_to(root).parts
              before = path.read_bytes() if path.exists() else b''
              if edit['before'] is None:
                  assert not path.exists(), edit['path']
              else:
                  assert hashlib.sha256(before).hexdigest() == edit['before'], edit['path']
              lines = before.decode('utf-8').splitlines(keepends=True)
              for start, end, replacement in reversed(edit['changes']):
                  lines[start:end] = replacement
              after = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(after).hexdigest() == edit['after'], edit['path']
              prepared.append((path, after))
          for path, after in prepared:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(after)
              print('verified:', path.relative_to(root))
          PY
      - name: Commit only the finished implementation
        shell: bash
        run: |
          git rm .github/cli-breakthrough-*.b64 .github/workflows/cli-breakthrough-apply.yml .github/workflows/cli-breakthrough-snapshot.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: connect bounded context-unverified CLI pilot using measured K46 plan'
          git push origin HEAD:refs/heads/chatgpt/cli-breakthrough-20260924
