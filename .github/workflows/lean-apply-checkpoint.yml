name: lean-apply-checkpoint
on:
  push:
    branches: [chatgpt/lean-cancellation-20260924]
    paths: [.review-work/lean-runtime.2.b64]
permissions:
  contents: read
jobs:
  apply-reviewed-source:
    if: github.ref == 'refs/heads/chatgpt/lean-cancellation-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify baseline and exact reviewed patch
        run: |
          git diff --exit-code 2e9a74731770b59f2c57f154abe28a9d84654154 HEAD -- app core tests
          python - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          encoded = ''.join(Path('.review-work/lean-runtime.' + n + '.b64').read_text() for n in ('1', '2'))
          raw = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest() == '071f541b86851bd2ded9719519b8478620c6847e29e471a8334aebee82f6c491'
          Path(os.environ['RUNNER_TEMP'], 'reviewed.patch').write_bytes(raw)
          PY
          git apply --check --unidiff-zero "$RUNNER_TEMP/reviewed.patch"
          git apply --index --unidiff-zero "$RUNNER_TEMP/reviewed.patch"
          git diff --cached --check
          TREE=$(git write-tree)
          test "$(git rev-parse "$TREE:app")" = a8dbab5b11718cfb41db3537d0db8325a3bcfe81
          test "$(git rev-parse "$TREE:core")" = 8fa6e4ba053e8b67d9c5a0a2a16a30ea0a9621de
          test "$(git rev-parse "$TREE:tests")" = 24a3ba61b81f73e52bcaf69cca639c3362cda7ae
      - name: Run new synthetic regressions
        run: |
          python -m unittest discover -s tests -p 'test_*cancel.py' -v
          python -m unittest discover -s tests -p test_server_limits.py -v
          python -m unittest discover -s tests -p test_app_lean.py -v
      - name: Save only the staged product and regression changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bounded lifecycle, durable cancellation and lean state projection' -m 'Apply the locally tested source delta after SHA256 and app/core/tests tree verification. Reuse the existing executor/runner cancellation signal, persist cancellation before signaling, reject late drafts, preserve reserved budgets and unconfirmed slots, bound worker and HTTP lifetimes, and avoid full event-payload reads. Local full suite: 347 tests, 18 skipped. Final exact-head CI and updated handoff still required. No real model calls; no main or other-session branch writes.'
          git push origin HEAD:refs/heads/chatgpt/lean-cancellation-20260924
          git log -1 --format='%H %T'
