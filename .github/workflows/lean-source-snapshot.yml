name: lean-source-snapshot
on:
  push:
    branches: [chatgpt/lean-cancellation-20260924]
    paths: [.github/workflows/lean-source-snapshot.yml]
permissions:
  contents: read
jobs:
  tracked-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive only tracked source at the reviewed baseline
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/tracked-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: lean-tracked-source
          path: ${{ runner.temp }}/tracked-source.tar
          retention-days: 1
