<!doctype html>
<html lang="ko" data-theme="light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ledger · 오프라인 검토 시안</title>
<style>
:root{--page:#f4f5f3;--panel:#fbfbfa;--raised:#e9eae6;--ink:#16181a;--sub:#4c5157;--muted:#59616e;--line:#b9bdb7;--soft:#dcdeda;--accent:#33518c;--supported:#1c6b4b;--qualified:#8a6116;--unresolved:#c22e4e;--sealed:#5e4b9a}
:root[data-theme=dark]{--page:#141618;--panel:#1b1e21;--raised:#232629;--ink:#e7e8e6;--sub:#a9aeb2;--muted:#a9aeb2;--line:#3c4147;--soft:#2c3034;--accent:#8ea6d8;--supported:#5cbf95;--qualified:#d6a65a;--unresolved:#f07b95;--sealed:#a996e0}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:15px/1.65 "Malgun Gothic",system-ui,sans-serif}button,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--muted);border-radius:2px;min-height:40px;padding:7px 12px;cursor:pointer;max-width:100%}button[aria-pressed=true]{color:var(--accent);border:2px solid var(--accent);padding:6px 11px}button:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}a{color:var(--accent)}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;gap:20px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:15px}.brand{font-size:27px;font-weight:600;letter-spacing:-.035em}.sub,.note{color:var(--sub)}.mono{font:12px/1.6 ui-monospace,Consolas,monospace;letter-spacing:.035em}.eyebrow{font-size:12px;color:var(--sub);letter-spacing:.07em}.notice{margin:18px 0;border:1px dashed var(--muted);padding:10px 14px;color:var(--sub);font-size:13px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:6px 0 20px}.control{display:flex;align-items:center;gap:8px;flex-wrap:wrap}label{font-size:13px;color:var(--sub)}.layout-controls{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}.main{min-width:0;display:flex;flex-direction:column;gap:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:22px;min-width:0;overflow-wrap:anywhere}.panel-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}h1{font-size:23px;line-height:1.6;margin:10px 0 14px;letter-spacing:-.02em}h2{font-size:16px;margin:0}h3{font-size:14px;margin:0 0 7px}.status{font:12px/1.7 ui-monospace,Consolas,monospace;border-bottom:2px solid currentColor;padding-bottom:2px;display:inline-block}.qualified{color:var(--qualified)}.supported{color:var(--supported)}.unresolved{color:var(--unresolved);border-bottom-width:3px}.sealed{color:var(--sealed)}.unknown{color:var(--muted);border:1px dashed currentColor;padding:1px 7px}.recommendation{font-size:16px;margin:0 0 22px}.overturn{padding:0 0 0 14px;border-left:3px solid var(--unresolved)}.overturn p{margin:0;font-size:14px}.next{margin-top:22px;border-top:1px solid var(--soft);padding-top:15px}.next p{margin:0;font-size:14px}.note{font-size:13px;margin:10px 0 0}.attention{border-top:3px solid var(--unresolved)}.table-scroll{overflow-x:auto}.ledger{width:100%;border-collapse:collapse;min-width:500px;font-size:13px}.ledger th{text-align:left;font-size:12px;color:var(--sub);font-weight:500;background:var(--raised)}.ledger th,.ledger td{padding:12px 10px;border-bottom:1px solid var(--soft);vertical-align:top}.ledger td:first-child{width:38px}.ledger td:last-child{min-width:138px}.ledger p{margin:7px 0 0}.row{padding:12px 0;border-top:1px solid var(--soft);display:flex;gap:12px;justify-content:space-between;align-items:start;flex-wrap:wrap}.metric{font-size:25px;font-variant-numeric:tabular-nums;line-height:1.3}.small{font-size:12px;color:var(--sub)}.slots{display:flex;gap:5px;margin:12px 0}.slot{width:24px;height:9px;border:1px solid var(--muted)}.used{background:var(--muted)}.slot-unknown{border-style:dashed;background:none}.sidebar{display:flex;flex-direction:column;gap:15px}.sidebar .panel{padding:18px}.sidebar h2{font-size:14px}.sidebar p{margin:8px 0}.foot{padding-top:24px;margin-top:26px;border-top:1px solid var(--line);font-size:12px;color:var(--sub)}details{margin-top:15px;border-top:1px solid var(--soft);padding-top:12px}summary{cursor:pointer;color:var(--accent);min-height:36px;padding:3px 0;font-size:13px}code{font:12px/1.6 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--raised);padding:12px;font-size:12px}p{overflow-wrap:anywhere}.empty{padding:16px 0}.empty strong{display:block;font-size:19px;margin-bottom:8px}
@media(max-width:850px){.workspace{grid-template-columns:minmax(0,1fr)}.sidebar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.layout-controls{margin-left:0}}
@media(max-width:520px){.wrap{padding:16px}.panel{padding:17px}.sidebar{grid-template-columns:minmax(0,1fr)}h1{font-size:20px}.controls{align-items:stretch}.control{width:100%}.control select{width:100%}.top{gap:4px}.layout-controls{width:100%}.layout-controls button{flex:1;font-size:13px}}
</style>
<div class="wrap">
<header class="top"><div><span class="brand">Ledger</span> <span class="sub">/ 검토 작업대</span></div><div class="mono">DESIGN REVIEW · UNPUBLISHED</div></header>
<div class="notice"><strong>오프라인 비교 시안</strong> · 실제 provider 연결 0건 · 아래 상태와 수치는 합성 예시입니다. 실모델 실행·과금·검증 도구를 호출하지 않습니다.</div>
<div class="controls" aria-label="시안 비교 설정">
<div class="control"><label for="scenario">합성 상태</label><select id="scenario"><option value="review">조건부 검토</option><option value="sealed">독립 초안 봉인</option><option value="lost">취소 후 종료 불명</option><option value="empty">아직 연결하지 않음</option></select></div>
<div class="layout-controls"><button id="decision-first" aria-pressed="true">결정 먼저</button><button id="ledger-first" aria-pressed="false">대조표 먼저</button><button id="theme" aria-pressed="false">어두운 테마</button></div>
</div>
<div class="workspace"><main id="main" class="main" aria-label="검토 내용"></main><aside id="side" class="sidebar" aria-label="실행과 사용량"></aside></div>
<footer class="foot">Q4/Q8 비교 준비물이며 우승 레이아웃은 미확정입니다. 기존 design/ 발행본을 수정하지 않은 별도 시안입니다.<br>본문과 키보드 이동 순서를 함께 바꿉니다. 실제 앱에서는 서버가 권한에 맞는 데이터만 전달해야 합니다.</footer>
</div>
<script>
'use strict';
let layout = 'decision';
const $ = id => document.getElementById(id);
// 고정 합성 fixture 전용이다. 모델/사용자 텍스트를 innerHTML에 넣는 예제가 아니다.
const decision = `<section class="panel" id="decision-panel"><div class="panel-header"><span class="eyebrow">01 / 검토할 결정</span><span class="status qualified">qualified · 조건부</span></div><h1>검사 결과를 모델이 직접 기록하도록 허용할 것인가?</h1><p class="recommendation">모델에는 <strong>검사 요청</strong>만 열고, 통과·실패 기록은 <strong>실제 검사 실행기</strong>에 제한합니다.</p><div class="overturn"><h3>이 결정을 뒤집을 조건</h3><p>모델이 제출한 결과라도 독립된 실행 영수증으로 출처·입력·검사 버전을 대조하고 위조를 거부할 수 있어야 합니다. 그 경계는 아직 실환경에서 검증하지 않았습니다.</p></div><div class="next"><h3>다음으로 필요한 검사</h3><p>동일한 요청 ID 재전송, 다른 실행의 영수증 재사용, 존재하지 않는 검사 ID를 차단하는지 확인합니다.</p></div><p class="note">모델 간 일치 수는 검증 상태를 승격시키지 않습니다.</p></section>`;
const ledger = `<section class="panel" id="ledger-panel"><div class="panel-header"><h2>주장별 대조</h2><span class="eyebrow">예시 3건 / 실제 증거 원장 아님</span></div><div class="table-scroll" role="region" aria-label="주장 대조표, 좁은 화면에서는 가로 스크롤" tabindex="0"><table class="ledger"><thead><tr><th>ID</th><th>주장 / 남은 조건</th><th>근거와 상태</th></tr></thead><tbody><tr><td>c1</td><td>종료 불명 호출도 예산 슬롯을 점유한다.<p class="small">범위: 고정 합성 입력</p></td><td><span class="status supported">supported</span><p><code>test:passed · 예시</code></p></td></tr><tr><td>c2</td><td>현재 사용자 기기에서 계정 한도를 조회할 수 있다.<p class="small">문서상 경로와 로컬 가용성을 구분해야 함</p></td><td><span class="status unresolved">unresolved</span><p><code>source:inconclusive · 예시</code></p></td></tr><tr><td>c3</td><td>원문 위치를 찾았으면 주장이 참이다.<p class="small">원문 회수와 의미상 뒷받침은 다른 검사</p></td><td><span class="status unresolved">unresolved</span><p><code>self_report · 예시</code></p></td></tr></tbody></table></div><details><summary>검사 기록의 범위 보기</summary><p class="note">기록 형식 검사, 실제 실행 관측, 주장의 의미 검증은 서로 다릅니다. 기존 validate()는 합성 완료 기록의 일관성만 검사합니다.</p><pre>example_only: true
provider_connections: 0
live_evidence_executed: false</pre></details></section>`;
function runtime(state, used) {
 return `<section class="panel"><div class="panel-header"><h2>실행 관측</h2><span class="status ${state==='UNKNOWN'?'unknown':'sub'}">${state}</span></div><p class="small">주장 검증 상태와 별개</p><div class="row"><span>외부 호출 슬롯</span><strong class="metric">${used} / 7</strong></div><div class="slots" aria-hidden="true">${Array.from({length:7},(_,i)=>`<span class="slot ${i<used?'used':''} ${state==='UNKNOWN'&&i===used-1?'slot-unknown':''}"></span>`).join('')}</div><p class="small">성공률·작업 진척도가 아닙니다. 실패와 종료 불명도 점유합니다.</p></section><section class="panel"><h2>관측 범위별 사용량</h2><div class="row"><span>이 세션 토큰</span><span class="status unknown">미관측</span></div><div class="row"><span>계정 한도</span><span class="status unknown">미관측</span></div><p class="small">토큰·금액·한도 비율을 합산하지 않습니다. 실제 값에는 출처, 관측 시각과 갱신 창을 함께 표시합니다.</p></section>`;
}
function render() {
 const mode = $('scenario').value;
 let first, second;
 if (mode==='review') {first=decision;second=ledger;$('side').innerHTML=runtime('수집 종료 · 예시',7);}
 if (mode==='sealed') {first=`<section class="panel"><div class="panel-header"><h2>독립 초안</h2><span class="status sealed">SEALED · 2 / 3</span></div><h1>다른 참여자의 답변은 아직 열리지 않았습니다.</h1><div class="row"><span>참여자 A</span><span>제출됨</span></div><div class="row"><span>참여자 B</span><span>제출됨</span></div><div class="row"><span>참여자 C</span><span>권한 거절</span></div><p class="note">이 화면은 운영자용 상태입니다. 초안·미리보기·길이·토큰 수를 표시하지 않습니다.</p></section>`;second=`<section class="panel attention"><h2>요청한 정족수 미충족</h2><p>남은 두 답변으로 자동 진행하지 않습니다. 축소 진행에는 별도 승인이 필요하며, 결과에도 축소 사실이 남아야 합니다.</p></section>`;$('side').innerHTML=runtime('봉인 중 · 예시',3);}
 if (mode==='lost') {first=`<section class="panel attention"><div class="panel-header"><h2>종료를 확인할 수 없습니다</h2><span class="status unknown">UNKNOWN</span></div><h1>취소를 요청했지만, 종료 확인이 오지 않았습니다.</h1><p>창을 닫거나 연결이 끊겨도 작업 완료·취소 성공으로 바뀌지 않습니다. 기존 시도의 상태를 확인하기 전에 같은 작업을 자동 재실행하지 않습니다.</p><div class="next"><h3>다음 조치</h3><p>실행 ID와 프로세스 세대를 대조한 후 재연결합니다. 새 시도가 필요하다면 새 ID와 새 예산 슬롯을 사용합니다.</p></div></section>`;second=`<section class="panel"><h2>마지막 관측 · 합성 예시</h2><p><code>started → cancel_requested → connection_lost</code></p><p class="note">process_exited가 관측되지 않았습니다. exit 0도 단독으로 의미상 성공을 증명하지 않습니다.</p></section>`;$('side').innerHTML=runtime('UNKNOWN',4);}
 if (mode==='empty') {first=`<section class="panel"><span class="eyebrow">연결 전</span><div class="empty"><strong>먼저 실제 기기의 실행 경로를 확인합니다.</strong><p>공식 문서에 기능이 있다고 설치·로그인·권한 확인이 끝난 것은 아닙니다.</p></div><div class="row"><span>설치 버전 / 로그인 방식</span><span class="status unknown">미확인</span></div><div class="row"><span>읽기 전용 / 취소 / 한도 관측</span><span class="status unknown">미확인</span></div></section>`;second=`<section class="panel"><h2>다음 단계 · V04-01</h2><p>실제로 운용할 PC에서 지원 기능과 효과적인 권한을 확인합니다. 이 시안에는 실행 버튼이 없습니다.</p></section>`;$('side').innerHTML=runtime('미연결',0);}
 $('main').innerHTML = layout==='decision' ? first+second : second+first;
 $('decision-first').setAttribute('aria-pressed', String(layout==='decision'));
 $('ledger-first').setAttribute('aria-pressed', String(layout==='ledger'));
}
$('scenario').addEventListener('change',render);
$('decision-first').addEventListener('click',()=>{layout='decision';render();});
$('ledger-first').addEventListener('click',()=>{layout='ledger';render();});
$('theme').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('theme').setAttribute('aria-pressed',String(dark));$('theme').textContent=dark?'밝은 테마':'어두운 테마';});
render();
</script>
</html>
